name: Deploy Briefing Archive

concurrency:
  group: deploy-briefing
  cancel-in-progress: false
  
on:
  push:
    branches:
      - main
    paths:
      - 'data/briefing/**'
      - 'data/latest.json'
      - 'data/prices.json'
      - 'frontend/src/**'
      - 'frontend/public/**'

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install
        working-directory: frontend

      - name: Build
        run: npm run build
        working-directory: frontend
        env:
          CI: false

      - name: Copy briefing to build
        run: |
          mkdir -p frontend/build/data/briefing
          cp -r data/briefing/* frontend/build/data/briefing/

      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: frontend/build
          publish_branch: gh-pages
          force_orphan: false
